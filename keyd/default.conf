# Caps Lock as the tmux prefix, for Linux machines without Omarchy/Hyprland.
#
#   sudo mkdir -p /etc/keyd
#   sudo cp keyd/default.conf /etc/keyd/default.conf
#   sudo systemctl enable --now keyd
#
# keyd works below the desktop, so this applies in every app, not only
# terminals. Caps Lock's own toggle is gone; hold Shift for capitals.
[ids]
*

[main]
capslock = C-space
